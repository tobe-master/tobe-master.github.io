<!-- ===== LiveRe 去广告拦截器（AdSense / Taboola / Dable / Coupang / 韩系联盟） ===== -->
<script>
(function () {
  'use strict';

  /* 广告资源域名：抓自 livere main-*.js 全部外链，只放广告类，livere.org / livere.com 自身 API 不动 */
  var AD_HOST = new RegExp([
    'googlesyndication',
    'doubleclick',
    'googletagservices',
    'taboola',
    'dable\\.io',
    'insight\\.co\\.kr',
    'coupang\\.com',
    'interworksmedia',
    'innorame\\.com',
    'aceplanet',
    'shoppingcall',
    'adop\\.cc',
    'was\\.livere\\.me',
    'lap\\.livere\\.com',
    'ads-partners'
  ].join('|'), 'i');

  /* 广告容器：隐藏 + 清空，不删节点，避免 livere 内部 getElementById 拿到 null 报错 */
  var HIDE_SEL = [
    '[id^="lv-ad-"]',
    '[class^="lv-ad-"]',
    '[id^="taboola"]',
    '[class*="taboola"]',
    '[class*="trc_"]',
    '[id^="dablewidget_"]',
    '[class*="dable"]',
    '[id^="nitmus_"]',
    '[id^="div-apt-ad-"]',
    '#adsense-livere',
    '#lap-frame',
    'ins.adsbyadop'
  ].join(',');

  /* 广告载荷：直接移除 */
  var DROP_SEL = [
    '.adsbygoogle',
    '#tb_loader_script',
    'script[src*="googlesyndication"]',
    'script[src*="googletagservices"]',
    'script[src*="taboola"]',
    'script[src*="dable.io"]',
    'script[src*="insight.co.kr"]',
    'script[src*="adop.cc"]',
    'iframe[src*="taboola"]',
    'iframe[src*="coupang"]',
    'iframe[src*="interworksmedia"]',
    'iframe[src*="innorame"]',
    'iframe[src*="aceplanet"]',
    'iframe[src*="livere.me"]',
    'iframe[src*="shoppingcall"]',
    'iframe[src*="ads-partners"]',
    '[id^="taboola"] iframe',
    '[id^="lv-ad-"] iframe'
  ].join(',');

  /* 1) 打桩第三方推荐 SDK，让 livere 里的检测分支直接跳过脚本注入 */
  if (!window.dable) {
    var _dq = [];
    var _dable = function () { _dq.push(arguments); return _dq.length; };
    _dable.q = _dq;
    window.dable = _dable;
  }
  if (!window._taboola) {
    window._taboola = [];
  }

  /* 2) 拦截 script / iframe 的 src 属性赋值与 setAttribute，广告资源请求根本不发出 */
  ['HTMLScriptElement', 'HTMLIFrameElement'].forEach(function (name) {
    var proto = window[name] && window[name].prototype;
    if (!proto) return;
    var desc = Object.getOwnPropertyDescriptor(proto, 'src');
    if (!desc || !desc.set) return;
    Object.defineProperty(proto, 'src', {
      configurable: true,
      enumerable: desc.enumerable,
      get: desc.get,
      set: function (value) {
        if (typeof value === 'string' && AD_HOST.test(value)) return;
        return desc.set.call(this, value);
      }
    });
  });

  var _setAttribute = Element.prototype.setAttribute;
  Element.prototype.setAttribute = function (name, value) {
    if (
      String(name).toLowerCase() === 'src' &&
      this.tagName &&
      (this.tagName === 'SCRIPT' || this.tagName === 'IFRAME') &&
      typeof value === 'string' &&
      AD_HOST.test(value)
    ) {
      return;
    }
    return _setAttribute.call(this, name, value);
  };

  /* 3) 清理已存在 / 新插入的广告节点 */
  function neutralize(el) {
    if (!el || el.nodeType !== 1) return;
    el.style.setProperty('display', 'none', 'important');
    el.style.setProperty('height', '0', 'important');
    el.style.setProperty('margin', '0', 'important');
    el.style.setProperty('padding', '0', 'important');
    while (el.firstChild) el.removeChild(el.firstChild);
  }

  function kill(node) {
    if (!node || node.nodeType !== 1) return;
    if (node.matches && node.matches(HIDE_SEL)) {
      neutralize(node);
      return;
    }
    if (node.matches && node.matches(DROP_SEL)) {
      node.remove();
      return;
    }
    if (node.querySelectorAll) {
      var hides = node.querySelectorAll(HIDE_SEL);
      for (var i = 0; i < hides.length; i++) neutralize(hides[i]);
      var drops = node.querySelectorAll(DROP_SEL);
      for (var j = drops.length - 1; j >= 0; j--) drops[j].remove();
    }
  }

  function sweep() {
    var h = document.querySelectorAll(HIDE_SEL);
    for (var i = 0; i < h.length; i++) neutralize(h[i]);
    var d = document.querySelectorAll(DROP_SEL);
    for (var j = d.length - 1; j >= 0; j--) d[j].remove();
  }

  function boot() {
    sweep();
    if (window.MutationObserver) {
      new MutationObserver(function (records) {
        for (var i = 0; i < records.length; i++) {
          var added = records[i].addedNodes;
          for (var j = 0; j < added.length; j++) kill(added[j]);
        }
      }).observe(document.documentElement || document, { childList: true, subtree: true });
    }
    /* livere / taboola 均为异步渲染，多轮兜底 */
    [0, 200, 600, 1200, 2500, 4000, 6000, 9000, 12000].forEach(function (ms) { setTimeout(sweep, ms); });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', boot);
  } else {
    boot();
  }
})();
</script>

<script>
  window.addEventListener('tabs:register', () => {
    let { activeClass } = CONFIG.comments;
    if (CONFIG.comments.storage) {
      activeClass = localStorage.getItem('comments_active') || activeClass;
    }
    if (activeClass) {
      let activeTab = document.querySelector(`a[href="#comment-${activeClass}"]`);
      if (activeTab) {
        activeTab.click();
      }
    }
  });
  if (CONFIG.comments.storage) {
    window.addEventListener('tabs:click', event => {
      if (!event.target.matches('.tabs-comment .tab-content .tab-pane')) return;
      let commentClass = event.target.classList[1];
      localStorage.setItem('comments_active', commentClass);
    });
  }
</script>
